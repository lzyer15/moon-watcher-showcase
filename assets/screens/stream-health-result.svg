<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="20" fill="#f4f3ef"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif"><text x="48" y="54" font-size="17" fill="#53665a" font-weight="400">Trading Hub · 공개 Swift 예제 실행 결과</text><text x="48" y="103" font-size="30" fill="#172b26" font-weight="700">연결 상태와 시세 신선도는 다르다</text><text x="48" y="146" font-size="18" fill="#53665a" font-weight="400">프로덕션 TradeStreamHealth.swift를 그대로 실행했다. 외부 네트워크와 주문 실행은 없다.</text><rect x="48" y="180" width="1104" height="100" rx="12" fill="white" stroke="#d7ded7"/><text x="72" y="216" font-size="22" fill="#172b26" font-weight="700">오래된 프레임이 매초 계속 들어옴</text><text x="72" y="252" font-size="20" fill="#244b3b" font-weight="400">15초 시점에 재연결 필요</text><rect x="48" y="300" width="1104" height="100" rx="12" fill="white" stroke="#d7ded7"/><text x="72" y="336" font-size="22" fill="#172b26" font-weight="700">같은 순간에 오래된 프레임 100개</text><text x="72" y="372" font-size="20" fill="#244b3b" font-weight="400">재연결하지 않음</text><rect x="48" y="420" width="1104" height="100" rx="12" fill="white" stroke="#d7ded7"/><text x="72" y="456" font-size="22" fill="#172b26" font-weight="700">조용한 시장에서 드문 프레임 두 개</text><text x="72" y="492" font-size="20" fill="#244b3b" font-weight="400">재연결하지 않음</text><text x="48" y="602" font-size="17" fill="#53665a" font-weight="400">원본 테스트 시나리오 2개 / assertions 120개 통과 · 입력 시각과 시세는 모두 가상 값</text></g></svg>